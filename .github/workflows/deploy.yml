name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - uses: actions/configure-pages@v6

      # The two GitHub Pages steps are skipped under act (https://nektosact.com/), which sets the ACT
      # environment variable: act's artifact server does not speak the current upload protocol, and
      # deploying needs an OIDC token that only GitHub's own runners can mint.
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !env.ACT }}
        with:
          path: ./dist

      - uses: actions/deploy-pages@v5
        if: ${{ !env.ACT }}

      - name: Explain the skipped steps when running under act
        if: ${{ env.ACT }}
        run: echo "::notice::Artifact upload and Pages deploy skipped - they only run on GitHub. Lint, tests and build passed."
